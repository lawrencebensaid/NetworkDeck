dependencies:
  espressif/mdns: "^1.15.1"
  # Wi-Fi through the P4-NANO's co-processor over SDIO, with the esp_wifi API proxied to it.
  # The board's co-processor is an ESP32-C5 running esp-hosted 2.12.9: the host side must match.
  espressif/esp_wifi_remote: "^1.6.5"
  espressif/esp_hosted: "2.12.9"
