<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck32</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--line:#d2d2d7;--accent:#0071e3;--ok:#1f8f3a;--bad:#c9341e}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--text:#f5f5f7;--muted:#98989d;--line:#38383a;--accent:#0a84ff;--ok:#30d158;--bad:#ff453a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:26px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
section{background:var(--card);border-radius:14px;padding:18px;margin:0 0 16px}
h2{font-size:17px;margin:0 0 12px}
dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0}
dt{color:var(--muted)}dd{margin:0;word-break:break-word}
label{display:block;color:var(--muted);font-size:13px;margin:10px 0 4px}
input,select{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
button{font:inherit;border:0;border-radius:8px;padding:9px 16px;background:var(--accent);color:#fff;cursor:pointer;margin-top:12px}
button.secondary{background:transparent;color:var(--accent);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:default}
.msg{margin:10px 0 0;font-size:14px;min-height:1.4em}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}.msg.wait{color:var(--muted)}
.seg{display:flex;gap:16px;margin-top:4px}.seg label{display:flex;gap:6px;align-items:center;color:var(--text);margin:0;font-size:15px}
.seg input{width:auto}
progress{width:100%;margin-top:10px}
a{color:var(--accent)}
.hidden{display:none}
</style>
</head>
<body>
<main>
  <h1 id="name">Deck32</h1>
  <p class="sub">Stream Deck Network Dock</p>
  <button id="logout" class="secondary" type="button">Sign out</button>

  <section>
    <h2>Status</h2>
    <dl id="status"><dt>Loading…</dt><dd></dd></dl>
  </section>

  <section>
    <h2>Wi-Fi</h2>
    <p class="sub" id="wifinote">Used when no Ethernet cable is connected.</p>
    <div class="row">
      <select id="ssid"><option value="">Choose a network…</option></select>
      <button class="secondary" id="scan" type="button" style="flex:0 0 auto">Scan</button>
    </div>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password">
    <button id="join" type="button">Join</button>
    <p class="msg" id="wifimsg"></p>
  </section>

  <section>
    <h2>Network</h2>
    <div class="seg">
      <label><input type="radio" name="mode" value="dhcp" checked> DHCP</label>
      <label><input type="radio" name="mode" value="static"> Static</label>
    </div>
    <div id="staticfields" class="hidden">
      <label for="ip">IP address</label><input id="ip" inputmode="decimal" placeholder="192.168.1.50">
      <label for="mask">Netmask</label><input id="mask" inputmode="decimal" placeholder="255.255.255.0">
      <label for="gw">Gateway</label><input id="gw" inputmode="decimal" placeholder="192.168.1.1">
    </div>
    <button id="savenet" type="button">Save</button>
    <p class="msg" id="netmsg"></p>
  </section>

  <section>
    <h2>Firmware</h2>
    <p class="sub">Upload a Deck32 <code>.bin</code>. If the new firmware fails to start, the dock goes back to this one.</p>
    <input id="fw" type="file" accept=".bin">
    <button id="upload" type="button">Install</button>
    <progress id="prog" class="hidden" max="100" value="0"></progress>
    <p class="msg" id="fwmsg"></p>
  </section>

  <p class="sub"><a href="/trace">Protocol trace</a></p>
</main>
<script>
const $ = id => document.getElementById(id);
const escapeHTML = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let hotspot = false;
let loaded = false;
// Expiry/reboot/login in another browser must take us back to sign-in, not a stale console.
const nativeFetch = window.fetch.bind(window);
window.fetch = async (...args) => {
  const response = await nativeFetch(...args);
  if (response.status === 401) location.replace('/');
  return response;
};
$('logout').onclick = async () => {
  await fetch('/api/logout', {method: 'POST', headers: {'X-NetworkDeck': '1'}});
  location.replace('/');
};

function say(el, text, kind) { el.textContent = text; el.className = 'msg ' + (kind || ''); }
function waitText() { return hotspot ? 'Working…' : 'Confirm on the deck: press ✓ (you have 30 seconds).'; }

async function refresh() {
  try {
    const s = await (await fetch('/api/status')).json();
    hotspot = !!s.via_hotspot;
    $('name').textContent = s.name;
    document.title = s.name;
    const rows = [
      ['Network', s.link + (s.wifi_ssid && s.link === 'Wi-Fi' ? ' (' + s.wifi_ssid + ')' : '')],
      ['IP address', s.ip || '–'],
      ['Addressing', s.dhcp ? 'DHCP' : 'Static'],
      ['Stream Deck app', s.host ? 'Connected' : 'Not connected'],
      ['Deck', s.deck || 'None'],
      ['Serial', s.serial],
      ['Firmware', s.firmware + ' (build ' + s.build + ')'],
    ];
    $('status').innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${escapeHTML(v)}</dd>`).join('');
    if (!s.wifi_available) $('wifinote').textContent = 'Wi-Fi is not available on this board.';
    if (!loaded) {
      // Fill the network form once; later refreshes must not overwrite what the user is typing.
      loaded = true;
      $('ip').value = s.static_ip; $('mask').value = s.static_mask; $('gw').value = s.static_gateway;
      document.querySelector(`input[name=mode][value=${s.dhcp ? 'dhcp' : 'static'}]`).checked = true;
      $('staticfields').classList.toggle('hidden', s.dhcp);
    }
  } catch (e) { /* the dock may be switching networks */ }
}

async function post(url, data, msg) {
  say(msg, waitText(), 'wait');
  try {
    const r = await fetch(url, { method: 'POST', headers: {'X-NetworkDeck': '1'}, body: new URLSearchParams(data) });
    const j = await r.json();
    say(msg, j.message, j.ok ? 'ok' : 'bad');
    refresh();
  } catch (e) { say(msg, 'The dock did not answer. It may have changed network.', 'bad'); }
}

$('scan').onclick = async () => {
  $('scan').disabled = true;
  say($('wifimsg'), 'Scanning…', 'wait');
  try {
    const list = await (await fetch('/api/scan')).json();
    $('ssid').innerHTML = '<option value="">Choose a network…</option>' +
      list.map(n => `<option value="${escapeHTML(n.ssid)}">${escapeHTML(n.ssid)}${n.secure ? '' : ' (open)'}</option>`).join('');
    say($('wifimsg'), list.length ? '' : 'No networks found.', list.length ? '' : 'bad');
  } catch (e) { say($('wifimsg'), 'Scan failed.', 'bad'); }
  $('scan').disabled = false;
};
$('join').onclick = () => post('/api/wifi', { ssid: $('ssid').value, password: $('pw').value }, $('wifimsg'));

for (const r of document.querySelectorAll('input[name=mode]'))
  r.onchange = () => $('staticfields').classList.toggle('hidden', r.value !== 'static' || !r.checked);
$('savenet').onclick = () => {
  const mode = document.querySelector('input[name=mode]:checked').value;
  post('/api/network', { mode, ip: $('ip').value, mask: $('mask').value, gateway: $('gw').value }, $('netmsg'));
};

$('upload').onclick = () => {
  const f = $('fw').files[0];
  if (!f) return say($('fwmsg'), 'Choose a .bin file first.', 'bad');
  const x = new XMLHttpRequest();
  $('prog').classList.remove('hidden');
  $('upload').disabled = true;
  x.upload.onprogress = e => { if (e.lengthComputable) $('prog').value = 100 * e.loaded / e.total; };
  x.upload.onload = () => say($('fwmsg'), 'Checking the image… ' + waitText(), 'wait');
  x.onload = () => {
    $('upload').disabled = false;
    if (x.status === 401) { location.replace('/'); return; }
    try { const j = JSON.parse(x.responseText); say($('fwmsg'), j.message, j.ok ? 'ok' : 'bad'); }
    catch (e) { say($('fwmsg'), 'Upload failed.', 'bad'); }
    if (x.status === 200) setTimeout(() => location.reload(), 8000);
  };
  x.onerror = () => { $('upload').disabled = false; say($('fwmsg'), 'Upload failed.', 'bad'); };
  x.open('POST', '/api/update');
  x.setRequestHeader('Content-Type', 'application/octet-stream');
  x.setRequestHeader('X-NetworkDeck', '1');
  x.send(f);
};

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
